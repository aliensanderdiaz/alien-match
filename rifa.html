<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selector Aleatorio</title>

<style>
    body{
        font-family: Arial, sans-serif;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:#f5f5f5;
    }

    button{
        padding:12px 24px;
        font-size:18px;
        cursor:pointer;
        border:none;
        border-radius:8px;
        background:#0078d4;
        color:white;
    }

    #resultado{
        margin-top:20px;
        font-size:24px;
        font-weight:bold;
        color:#333;
    }
</style>
</head>
<body>

<button id="elegir">Elegir opción</button>

<div id="resultado"></div>

<script>






const opciones = [
    "Opción 1",
    "Opción 2",
    "Opción 3",
    "Opción 4",
    "Opción 5",
    "Opción 6",
    "Opción 7",
    "Opción 8",
    "Opción 9",
    "Opción 10",
    "Opción 11",
    "Opción 12",
    "Opción 13",
    "Opción 14",
    "Opción 15",
    "Opción 16",
    "Opción 17",
    "Opción 18",
    "Opción 19",
    "Opción 20",
    "Opción 21",
    "Opción 22",
    "Opción 23",
    "Opción 24",
    "Opción 25",
];

document.getElementById("elegir").addEventListener("click", () => {
    const indice = Math.floor(Math.random() * opciones.length);
    document.getElementById("resultado").textContent =
        `La opción elegida es: ${opciones[indice]}`;
});
</script>

</body>
</html>
